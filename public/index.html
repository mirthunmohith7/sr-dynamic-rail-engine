<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Southern Railway | Passenger Reservation Portal</title>
  <link rel="stylesheet" href="/css/user.css" />
</head>
<body>
  <header class="ir-navbar">
    <div class="ir-brand">
      <div class="ir-emblem">SR</div>
      <div>
        <h1>SOUTHERN RAILWAY — PASSENGER PORTAL</h1>
        <span>Indian Railways Online Ticket Reservation System</span>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">New User Registration</button>
      </div>

      <!-- Login Form -->
      <div class="auth-body" id="login-section">
        <h2>Passenger Sign In</h2>
        <p>Access your e-tickets, PNR status, and express reservations.</p>
        <div class="error-msg" id="login-error"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email ID</label>
            <input type="email" id="login-email" placeholder="Enter your registered email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
      </div>

      <!-- Registration Form -->
      <div class="auth-body" id="register-section" style="display: none;">
        <h2>Create Passenger Account</h2>
        <p>Register to book confirmed seats across Southern Railway corridors.</p>
        <div class="error-msg" id="register-error"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="e.g. Mirthun Mohith Sathish" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email ID</label>
            <input type="email" id="reg-email" placeholder="e.g. passenger@domain.com" required />
          </div>
          <div class="form-group">
            <label for="reg-password">Create Password</label>
            <input type="password" id="reg-password" placeholder="Minimum 6 characters" required />
          </div>
          <button type="submit" class="btn-primary">Register & Continue</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
